<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepVault - Move to Earn Aggregator</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; background: linear-gradient(135deg, #0f172a, #1e2937); color: #e2e8f0; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #67e8f9; font-size: 3rem; }
        .section { background: rgba(15, 23, 42, 0.8); padding: 30px; border-radius: 20px; margin-bottom: 30px; border: 1px solid #67e8f9; }
        input[type='range'] { width: 100%; }
        .value { font-size: 1.5rem; font-weight: bold; color: #67e8f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>StepVault</h1>
        <p style="font-size:1.3rem;">The Ultimate Move-to-Earn Aggregator</p>

        <div class="section">
            <h2>Live Earnings Simulator</h2>
            <p>Daily Steps: <span id="stepsVal">10000</span></p>
            <input type="range" id="steps" min="1000" max="20000" value="10000" oninput="update()">
            
            <p>Active Move-to-Earn Apps: <span id="appsVal">5</span></p>
            <input type="range" id="apps" min="3" max="30" value="5" oninput="update()">
            
            <h2 style="margin-top:20px;">Estimated Daily Earnings: <span id="earnings" class="value">$3.75</span></h2>
        </div>

        <div class="section">
            <h2>AI Agent Allocation System</h2>
            <button onclick="setPreset('earnings')">Max Daily Earnings Preset</button>
            <button onclick="setPreset('nft')">Max NFT Value Preset</button>
            <p id="presetStatus" style="margin-top:15px; font-weight:bold;"></p>
        </div>

        <div class="section">
            <h2>Subscription Tiers</h2>
            <p><strong>$9/month</strong> - 3 apps</p>
            <p><strong>$20/month</strong> - 10 apps</p>
            <p><strong>$50/month</strong> - 25 apps + Full AI</p>
        </div>
    </div>

    <script>
        function update() {
            const steps = parseInt(document.getElementById('steps').value);
            const apps = parseInt(document.getElementById('apps').value);
            document.getElementById('stepsVal').textContent = steps.toLocaleString();
            document.getElementById('appsVal').textContent = apps;
            
            const earnings = (steps * apps * 0.00025).toFixed(2);
            document.getElementById('earnings').textContent = '$' + earnings;
        }

        function setPreset(mode) {
            const msg = mode === 'earnings' ? 'Max Daily Earnings Mode Activated' : 'Max NFT Value Mode Activated';
            document.getElementById('presetStatus').textContent = msg;
        }

        // Initialize
        window.onload = update;
    </script>
</body>
</html>
